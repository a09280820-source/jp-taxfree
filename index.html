<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="退稅帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>日本購物退稅帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登入畫面 -->
<section id="login" hidden>
  <div class="login-card">
    <p class="eyebrow">TAX FREE JAPAN</p>
    <h1>日本購物退稅帳</h1>
    <p class="lead">拍下收據、記下店家，出境前一次對好退稅清單。</p>
    <div id="gbtn"></div>
    <p id="loginMsg" class="login-msg"></p>
  </div>
</section>

<!-- 主畫面 -->
<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div>
        <p class="eyebrow">TAX FREE JAPAN</p>
        <h1 class="brand">退稅帳</h1>
      </div>
      <div class="top-right">
        <div id="scopeBox" class="seg" hidden>
          <button data-act="scope" data-v="me">我</button>
          <button data-act="scope" data-v="all">全部</button>
        </div>
        <button id="syncChip" class="chip" data-act="sync"></button>
      </div>
    </div>
    <div id="banner" class="banner" hidden></div>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" data-act="new">＋ 新增收據</button>

  <nav class="tabs">
    <button data-act="tab" data-v="home">首頁</button>
    <button data-act="tab" data-v="receipts">收據</button>
    <button data-act="tab" data-v="tax">退稅清單</button>
    <button data-act="tab" data-v="settings">設定</button>
  </nav>
</div>

<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
<input id="filePick" type="file" accept="image/*" hidden>
<input id="fileMulti" type="file" accept="image/*" multiple hidden>
<input id="fileBackup" type="file" accept="application/json,.json" hidden>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<script src="calc.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
